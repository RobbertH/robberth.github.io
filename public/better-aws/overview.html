<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Better AWS — Account Overview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f1a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      min-height: 100vh;
    }

    h1 {
      font-size: 22px;
      color: #ff9f43;
      margin-bottom: 4px;
    }

    .subtitle {
      color: #636e72;
      font-size: 13px;
      margin-bottom: 24px;
    }

    /* ── Stats bar ─────────────────────────────────────────────────────── */

    .stats {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: #1a1a2e;
      border: 1px solid #2d2d44;
      border-radius: 8px;
      padding: 16px 24px;
      min-width: 160px;
      flex: 1;
    }

    .stat-card .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #636e72;
      margin-bottom: 6px;
    }

    .stat-card .value {
      font-size: 28px;
      font-weight: 700;
      color: #dfe6e9;
    }

    .stat-card .value.highlight { color: #ff9f43; }

    /* ── Graph canvas ──────────────────────────────────────────────────── */

    #graph-container {
      background: #1a1a2e;
      border: 1px solid #2d2d44;
      border-radius: 8px;
      position: relative;
      width: 100%;
      height: 520px;
      overflow: hidden;
    }

    canvas#graph {
      width: 100%;
      height: 100%;
    }

    /* ── Legend ─────────────────────────────────────────────────────────── */

    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #b2bec3;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* ── Empty state ───────────────────────────────────────────────────── */

    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #636e72;
    }

    .empty h2 {
      font-size: 16px;
      margin-bottom: 8px;
      color: #b2bec3;
    }

    .empty p { font-size: 13px; }

    /* ── Toolbar ────────────────────────────────────────────────────────── */

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .toolbar button {
      background: #16213e;
      color: #dfe6e9;
      border: 1px solid #2d2d44;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .toolbar button:hover { background: #1a2744; }
  </style>
</head>
<body>
  <h1>Account Overview</h1>
  <p class="subtitle">Resource graph built from observed AWS API traffic</p>

  <div class="stats">
    <div class="stat-card">
      <div class="label">Services seen</div>
      <div class="value highlight" id="stat-services">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Unique actions</div>
      <div class="value" id="stat-actions">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Total requests</div>
      <div class="value" id="stat-requests">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Error rate</div>
      <div class="value" id="stat-errors">0%</div>
    </div>
  </div>

  <div class="toolbar">
    <span style="font-size:13px;color:#b2bec3">Service → Action relationship graph</span>
    <button id="btn-refresh">Refresh</button>
  </div>

  <div id="graph-container">
    <canvas id="graph"></canvas>
  </div>

  <div class="legend" id="legend"></div>

  <script src="overview.js"></script>
</body>
</html>
